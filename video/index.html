<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Império do EPS — Como orçar em 30 segundos (Stories)</title>
<meta name="description" content="Como calcular a obra com o Blocão e pedir orçamento pelo WhatsApp, em 30 segundos.">
<link rel="stylesheet" href="motion.css">
</head>
<body>
<!-- Motor de vídeo: engenharia reversa do vídeo "Como pedir" da Pizza em Dobro.
     O celular mostra o SITE DE VERDADE (iframe) e o vídeo comanda rolagem, digitação e cliques.
     Gerar o MP4: ver README.md → "Vídeo tutorial". -->
<div id="palco">
  <div id="fundo"></div><div id="tinta"></div><div id="escuro"></div>
  <canvas id="part" width="1080" height="1920"></canvas>
  <div id="fone"><div id="ilha"></div><div id="tela"><iframe id="site" title="Site do Império do EPS" src="about:blank"></iframe><div id="zap"></div><div id="brilho"></div></div></div>
  <div id="rail"><i></i></div>
  <div id="parte"></div>
  <div id="cap" aria-live="polite"></div>
  <div id="fim"></div>
  <div id="credito"><canvas id="cuboMini" width="200" height="200"></canvas><div><b>VIBE CODING PROCESS</b><span>Sites para comércio local</span></div></div>
  <div id="vinheta"></div><canvas id="grao" width="270" height="480"></canvas>
</div>
<div id="capa"><img src="../assets/img/favicon.svg" alt=""><h1>Como orçar em 30 segundos</h1><p>O site rolando: o Blocão 3D por dentro (vista demonstrativa), a calculadora e o orçamento chegando no WhatsApp. Formato Stories (1080×1920).</p>
  <div><button id="btSom" type="button">▶ Assistir com música</button><button class="sec" id="btMudo" type="button">Sem som</button></div></div>
<div id="ctl"><button id="btRe" type="button">↺ Recomeçar</button></div>
<audio id="som" src="trilha-como-orcar.mp3" preload="auto"></audio>
<script src="motion.js"></script>
<script>
Video.iniciar({
  tema:'imperio', tempos:'tempos-como-orcar.json',
  cenas:[
    {id:'splash',parte:'Abertura',html:'Parede pronta <b>rapidinho?</b>',fala:'Quer parede pronta rapidinho? Vem ver!',min:3.2,splash:true},
    {id:'hero',parte:'Blocão',html:'Conheça o nosso <b>Blocão</b>',fala:'Conheça o nosso Blocão!',min:2.2,rolagens:[{dt0:.2,dt1:-.2,y:140}]},
    {id:'dentro',parte:'Por dentro',html:'Role e veja <b>por dentro</b>',fala:'Role e veja por dentro!',rolar:{el:'por-dentro',pj:.2}},
    {id:'demo',parte:'Por dentro',html:'É só demonstração: na obra é <b>peça única</b>',fala:'É só demonstração! Na obra, é peça única.',rolagens:[{dt0:.1,dt1:-.2,el:'por-dentro',pj:.26}]},
    {id:'abre',parte:'Por dentro',html:'Abre <b>ao meio</b>',fala:'Abre ao meio!',min:2.2,rolar:{el:'por-dentro',pj:.36}},
    {id:'pecas',parte:'Peça por peça',html:'Cada peça, <b>sua medida</b>',fala:'Cada peça, sua medida!',min:2.6,rolar:{el:'por-dentro',pj:.66}},
    {id:'montado',parte:'Peça por peça',html:'Concreto + EPS: <b>um bloco só</b>',fala:'Concreto e é, pê, ésse: um bloco só!',min:2.4,rolar:{el:'por-dentro',pj:.86}},
    {id:'calc',parte:'Calculadora',html:'Calcule a <b>sua obra</b>',fala:'Calcule a sua obra!',min:3.6,rolar:{el:'calc-comprimento',off:340},
      acoes:[{dt:.1,fn:function(w,el){var f=w.document.querySelector('[data-calculadora]');f.elements.comprimento.value='';f.elements.altura.value='';f.dispatchEvent(new Event('input',{bubbles:true}));}}]},
    {id:'medidas',parte:'Calculadora',html:'Digite as <b>medidas</b>',fala:'Agora, digite as medidas!',min:3.0,
      digitar:[{id:'calc-comprimento',texto:'52',dt0:.1,dt1:.6},{id:'calc-altura',texto:'2,80',dt0:.8,dt1:1.5}],
      rolagens:[{dt0:1.6,dt1:-.15,el:'calc-resultado',off:420}]},
    {id:'zap',parte:'WhatsApp',html:'Orçamento no <b>WhatsApp</b>!',fala:'Orçamento direto no Uótsap!',zap:true,min:3.0},
    {id:'site',parte:'Site',html:'Site por <b>Vibe Coding Process</b>',fala:'Site feito pela Váib Côudim Prócess!',rolar:{y:'fim'}},
    {id:'fim',fim:true,min:3.4,tag:'Construa com o Império',fala:'Império do é, pê, ésse: a fábrica do Blocão!'}
  ]
});
</script>
</body>
</html>
